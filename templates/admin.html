{% extends 'base.html' %}{% block content %}<div class="row"><h2>USER MONITOR</h2><a class="muted" href="{{url_for('logout')}}">LOGOUT ↗</a></div><p class="muted">Unread: {{ unread }}</p><section class="panel">{% for user in users %}<div class="msg" style="display:flex; justify-content:space-between; align-items:center;"><div><b>{{ user.name }}</b><br><span class="muted">ID: {{ user.public_id }} · {{ user.username }}</span></div><a href="{{ url_for('admin_chat', user_id=user.id) }}" style="background:white; color:black; padding: 8px 12px; border-radius: 20px; font-size: 12px; font-weight:bold;">CHAT</a></div>{% endfor %}</section>{% endblock %}
