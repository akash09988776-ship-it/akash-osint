<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>AKASH OSINT</title>
<style>
* { box-sizing: border-box; }
body { 
    margin: 0; 
    background: #050505; 
    color: white; 
    font-family: Arial, sans-serif; 
    overflow-x: hidden; 
    min-height: 100vh; 
    position: relative;
}

/* Background Animation */
body::before {
    content: '';
    position: fixed;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: radial-gradient(circle at 50% 50%, rgba(255,255,255,0.08) 0%, transparent 60%);
    animation: bgMove 10s ease-in-out infinite alternate;
    z-index: -1;
    pointer-events: none;
}

@keyframes bgMove {
    0% { transform: translateY(-10%) scale(1); }
    100% { transform: translateY(10%) scale(1.1); }
}

a { color: inherit; text-decoration: none; }
button { background: #f5f5f5; color: #050505; border: 0; border-radius: 24px; padding: 12px 18px; font-weight: 700; cursor: pointer; }
input, textarea { width: 100%; padding: 13px; border: 1px solid #444; border-radius: 12px; background: #111; color: white; margin: 7px 0 14px; outline: none; font-family: inherit; }
.wrap { max-width: 760px; margin: auto; padding: 22px; position: relative; z-index: 1; }
.muted { color: #999; font-size: 13px; }
.panel { background: #101010; border: 1px solid #303030; border-radius: 20px; padding: 22px; margin: 16px 0; box-shadow: 0 0 30px #ffffff0a; }
.center { max-width: 420px; margin: 12vh auto; text-align: center; }
.flash { color: #ddd; background: #242424; padding: 10px; border-radius: 10px; margin: 10px 0; }
.row { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.msg { padding: 12px; border-bottom: 1px solid #292929; }
.danger { background: #222; color: #fff; border: 1px solid #777; }
.foot { margin-top: 55px; text-align: center; color: #777; font-size: 12px; }

/* PROFILE */
.profile-card { display: flex; align-items: center; gap: 13px; padding: 20px 0; position: relative; z-index: 5; }
.photo-box { position: relative; width: 58px; height: 58px; flex-shrink: 0; }
.photo-box img { width: 58px; height: 58px; border-radius: 50%; object-fit: cover; border: 1px solid #777; background: #171717; }
.upload-btn { position: absolute; right: -3px; bottom: 0; width: 21px; height: 21px; background: white; color: black; border-radius: 50%; display: grid; place-items: center; font-size: 17px; font-weight: bold; cursor: pointer; }
.profile-name { font-size: 15px; font-weight: bold; }
.profile-id { color: #999; font-size: 11px; margin-top: 6px; }

/* === TELEGRAM ICON (Fixed Right Side, Bot Style) === */
.floating-tg-right {
    position: fixed;
    right: 15px;  /* Right side */
    bottom: 20px; /* Niche */
    width: 45px;  /* Chhota size */
    height: 45px; /* Chhota size */
    background: #fff;
    color: #000;
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    box-shadow: 0 4px 15px rgba(255,255,255,0.2);
    z-index: 1000;
    transition: transform 0.2s;
}
.floating-tg-right:active { transform: scale(0.9); }
.floating-tg-right svg { width: 22px; height: 22px; margin-left: -2px; }

/* Dialog Box styling */
dialog {
    background: #111;
    color: white;
    border: 1px solid #444;
    border-radius: 16px;
    padding: 20px;
    width: 80%;
    max-width: 320px;
    text-align: center;
    box-shadow: 0 0 40px rgba(0,0,0,0.8);
}
dialog::backdrop { background: rgba(0, 0, 0, 0.8); backdrop-filter: blur(3px); }
.dialog-buttons { display: flex; justify-content: space-between; gap: 10px; margin-top: 20px; }
.dialog-buttons button { flex: 1; border-radius: 12px; padding: 10px; }
.btn-cancel { background: #333; color: #fff; }
.btn-logout { background: #dc3545; color: #fff; font-weight: bold; }
</style>
</head>
<body>
<main class="wrap">
    {% with items=get_flashed_messages() %}{% for m in items %}<div class="flash">{{m}}</div>{% endfor %}{% endwith %}

    {% if me %}
    <header class="profile-card">
        <div class="photo-box">
            <img id="profilePhoto" src="{{ url_for('static', filename='uploads/' + me['photo']) if me['photo'] else '' }}" onerror="this.src='https://placehold.co/100x100/171717/ffffff?text=+'">
            <form action="{{url_for('profile_photo')}}" method="post" enctype="multipart/form-data">
                <label for="photoUpload" class="upload-btn">+</label>
                <input type="file" id="photoUpload" name="photo" accept="image/*" hidden onchange="this.form.submit()">
            </form>
        </div>
        <div class="profile-info">
            <div class="profile-name">{{ me['name'] }}</div>
            <div class="profile-id">ID: {{ me['public_id'] }}</div>
        </div>
        
        <div style="margin-left:auto">
            <button onclick="document.getElementById('logoutDialog').showModal()" style="background:transparent; color:#999; padding:0; font-size:13px;">LOG OUT</button>
        </div>
    </header>
    {% endif %}

    {% block content %}{% endblock %}
</main>

<!-- FLOATING TELEGRAM ICON (RIGHT SIDE, SMALL) -->
{% if me %}
<a href="https://t.me/AK4SHOSINT" target="_blank" class="floating-tg-right">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M21.5 3.5L2.5 11.5L8.5 13.5L18.5 7.5L11.5 15.5L13.5 21.5L21.5 3.5Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
</a>
{% endif %}

<!-- LOGOUT CONFIRMATION DIALOG -->
<dialog id="logoutDialog">
    <h3 style="margin-top:0;">Log Out</h3>
    <p style="color:#aaa; font-size:14px;">Are you sure you want to log out?</p>
    <div class="dialog-buttons">
        <button class="btn-cancel" onclick="document.getElementById('logoutDialog').close()">Cancel</button>
        <a href="{{url_for('logout')}}" class="btn-logout" style="text-align:center; text-decoration:none; line-height: 24px; border-radius: 12px; padding: 10px;">Logout</a>
    </div>
</dialog>

<script>
const upload = document.getElementById("photoUpload");
const photo = document.getElementById("profilePhoto");
if (upload) {
    upload.addEventListener("change", function () {
        const file = this.files[0];
        if (!file || !file.type.startsWith("image/")) return;
        const reader = new FileReader();
        reader.onload = function () { if(photo) { photo.src = reader.result; } };
        reader.readAsDataURL(file);
    });
}
</script>
</body>
</html>
