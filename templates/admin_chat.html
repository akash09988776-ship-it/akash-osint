{% extends 'base.html' %}{% block content %}<div class="row"><h2>Chat: {{ user.name }}</h2><a class="muted" href="{{url_for('admin')}}">↶ BACK</a></div><section class="panel">{% for msg in messages %}<div class="msg"><b>{{ 'Admin' if msg.sender == 'admin' else user.name }}</b><div>{{ msg.message }}</div><div class="muted">{{ msg.created_at }}</div></div>{% else %}<p class="muted">No messages.</p>{% endfor %}</section><form method="POST"><textarea name="message" placeholder="Reply..." required></textarea><button>REPLY</button></form>{% endblock %}
